<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="assets/images/logo.png" />
  <title>Login — EverAfter Studios</title>
  <meta name="description" content="Login to your EverAfter Studios client account to view your wedding gallery, download images, and manage your booking." />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    body { margin: 0; }
    .auth-page { padding: 2rem 0; }
  </style>
</head>
<body>

<!-- ── Top-right auth controls ─────────────────────────────── -->
<div class="auth-controls">
  <button class="auth-toggle-btn theme-toggle-btn" aria-label="Toggle theme"><i class="bi bi-moon-stars-fill theme-icon"></i></button>
  <button class="auth-toggle-btn rtl-toggle-btn" aria-label="Toggle RTL"><span class="rtl-icon" aria-hidden="true">RTL</span></button>
</div>

<!-- ── Background ──────────────────────────────────────────── -->
<img src="assets/images/login-bg.jpg" alt="" class="auth-bg" onerror="this.style.display='none'" />
<div class="auth-overlay"></div>

<!-- ── Auth Page ───────────────────────────────────────────── -->
<div class="auth-page">
  <div class="auth-container">
    <!-- Card -->
    <div class="auth-card" data-aos="fade-up" data-aos-duration="900">
      <!-- Logo -->
      <div class="auth-logo">
        <a class="auth-logo-link" href="index.html" aria-label="EverAfter Studios home">
          <img src="assets/images/logo.png" alt="EverAfter Studios" onerror="this.style.display='none'" />
          <span class="auth-brand-text"><span class="auth-brand">EverAfter <span>Studios</span></span><span class="auth-script">Capturing Forever</span></span>
        </a>
      </div>

      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Sign in to your client portal to view your gallery and manage bookings.</p>

      <!-- Login Form -->
      <form class="auth-form" data-demo="true" id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <input type="email" class="form-control" id="loginEmail" placeholder="hello@email.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <div class="password-toggle">
            <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password" />
            <i class="bi bi-eye toggle-eye" role="button" aria-label="Show password"></i>
          </div>
        </div>
        <div class="d-flex align-items-center justify-content-between mb-3">
          <label style="display:flex;align-items:center;gap:0.4rem;font-size:0.82rem;color:rgba(255,255,255,0.75);cursor:pointer">
            <input type="checkbox" style="accent-color:var(--clr-primary)" /> Remember me
          </label>
          <a href="forgot-password.html" style="font-size:0.82rem;color:var(--clr-primary);font-weight:600">Forgot Password?</a>
        </div>
        <button type="submit" class="auth-submit-btn">Sign In</button>
      </form>

      <!-- Divider -->
      <div class="auth-divider"><span>Or continue with</span></div>

      <!-- Social Login -->
      <button class="social-login-btn google-btn">
        <svg width="18" height="18" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M44.5 20H24v8.5h11.8C34.7 33.9 29.8 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21c10.5 0 20-7.7 20-21 0-1.4-.1-2.7-.5-4z" fill="#FFC107"/>
          <path d="M6.3 14.7l7 5.1C15.1 16.3 19.2 13.5 24 13.5c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 5.1 29.6 3 24 3 16.3 3 9.7 7.8 6.3 14.7z" fill="#FF3D00"/>
          <path d="M24 45c5.5 0 10.5-1.9 14.4-5.2l-6.7-5.5C29.5 36.2 26.9 37 24 37c-5.8 0-10.7-3.9-12.5-9.3l-7 5.4C8.2 40.8 15.5 45 24 45z" fill="#4CAF50"/>
          <path d="M44.5 20H24v8.5h11.8c-0.8 2.5-2.5 4.5-4.8 5.9l6.7 5.5C41.5 36.6 45 31.2 45 24c0-1.4-.1-2.7-.5-4z" fill="#1976D2"/>
        </svg>
        Continue with Google
      </button>

      <button class="social-login-btn apple-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11"/>
        </svg>
        Continue with Apple
      </button>

      <!-- Footer link -->
      <p class="auth-footer-text">
        Don't have an account? <a href="signup.html">Create one here</a>
      </p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
